name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FTP_APP_PATH: ${{ vars.FTP_APP_PATH || 'solmir' }}
      FTP_PUBLIC_PATH: ${{ vars.FTP_PUBLIC_PATH || 'public_html' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, fileinfo, mbstring, pdo_mysql, xml
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Stage the Laravel release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/solmir release/public_html

          rsync -a \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.agents/' \
            --exclude 'AGENTS.md' \
            --exclude 'CLAUDE.md' \
            --exclude 'DEPLOYMENT.md' \
            --exclude 'README.md' \
            --exclude 'node_modules/' \
            --exclude 'public/' \
            --exclude 'release/' \
            --exclude 'storage/' \
            --exclude 'tests/' \
            --exclude 'phpunit.xml' \
            ./ release/solmir/

          rsync -a public/ release/public_html/

          mkdir -p \
            release/solmir/storage/app/private \
            release/solmir/storage/app/public \
            release/solmir/storage/framework/cache/data \
            release/solmir/storage/framework/sessions \
            release/solmir/storage/framework/views \
            release/solmir/storage/logs \
            release/solmir/bootstrap/cache

          cat > release/solmir/.env <<EOF
          APP_NAME=Solmir
          APP_ENV=production
          APP_KEY=${APP_KEY}
          APP_DEBUG=false
          APP_URL=https://solmir.ir

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_LEVEL=warning

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=zwpqbwoa_solmir
          DB_USERNAME=zwpqbwoa_solmir
          DB_PASSWORD=${DB_PASSWORD}

          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null

          CACHE_STORE=file
          QUEUE_CONNECTION=database
          FILESYSTEM_DISK=public

          MAIL_MAILER=log
          MAIL_FROM_ADDRESS=hello@solmir.ir
          MAIL_FROM_NAME=Solmir
          EOF

          cat > release/public_html/index.php <<PHP
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          \$appRoot = dirname(__DIR__).'/${FTP_APP_PATH}';

          if (file_exists(\$maintenance = \$appRoot.'/storage/framework/maintenance.php')) {
              require \$maintenance;
          }

          require \$appRoot.'/vendor/autoload.php';

          /** @var Application \$app */
          \$app = require_once \$appRoot.'/bootstrap/app.php';

          \$app->handleRequest(Request::capture());
          PHP

          tar -czf release/solmir-next.tar.gz -C release solmir public_html

      - name: Publish compressed release over FTPS
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Add FTP_HOST as a GitHub Actions secret.}"
          : "${FTP_PORT:?Add FTP_PORT as a GitHub Actions secret.}"
          : "${FTP_USERNAME:?Add FTP_USERNAME as a GitHub Actions secret.}"
          : "${FTP_PASSWORD:?Add FTP_PASSWORD as a GitHub Actions secret.}"

          sudo apt-get update
          sudo apt-get install --yes lftp

          lftp <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          # The hosting provider currently presents a self-signed certificate.
          # Re-enable certificate verification as soon as its valid FTPS certificate is issued.
          set ssl:verify-certificate false
          open -u "${FTP_USERNAME}","${FTP_PASSWORD}" "ftp://${FTP_HOST}:${FTP_PORT}"
          put -o .solmir-next.tar.gz.uploading release/solmir-next.tar.gz
          mv .solmir-next.tar.gz.uploading .solmir-next.tar.gz
          bye
          EOF
